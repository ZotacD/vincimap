[trainer]
disable_viewer = false
ckpt =
compression =
render_traj_path = interp

data_factor = 1
test_every = 8
patch_size =
global_scale = 1.0

normalize_world_space = true
camera_model = pinhole
load_exposure = true
port = 8080

batch_size = 1
steps_scaler = 1.0
max_steps = 30000
eval_steps = 30000
save_steps = 30000
ply_steps = 30000
save_ply = true
disable_video = false

init_type = sfm
init_num_pts = 100000
init_extent = 3.0
sh_degree = 2
sh_degree_interval = 2000
init_opa = 0.1
init_scale = 1.0
ssim_lambda = 0.2

near_plane = 0.1
far_plane = 300.0

strategy = default
packed = false
sparse_grad = false
visible_adam = false
antialiased = true
random_bkgd = false

means_lr = 0.00016
scales_lr = 0.003
opacities_lr = 0.03
quats_lr = 0.0007
sh0_lr = 0.0025
shN_lr = 0.0000625

opacity_reg = 0.001
scale_reg = 0.001

pose_opt = false
pose_opt_lr = 0.000001
pose_opt_reg = 0.0001
pose_noise = 0.0

app_opt = false
app_embed_dim = 16
app_opt_lr = 0.0005
app_opt_reg = 0.00001

post_processing =
bilateral_grid_fused = false
bilateral_grid_shape = 16,16,8
ppisp_use_controller = true
ppisp_controller_distillation = true
ppisp_controller_activation_num_steps = 25000
color_correct_method = affine
use_color_correction_metric = false

depth_loss = false
depth_lambda = 0.01

tb_every = 100
tb_save_image = false

lpips_net = alex
with_ut = false
with_eval3d = false

[default_strategy]
prune_opa = 0.0075
grow_grad2d = 0.0006
grow_scale3d = 0.012
grow_scale2d = 0.04
prune_scale3d = 0.08
prune_scale2d = 0.12
refine_scale2d_stop_iter = 12000
refine_start_iter = 500
refine_stop_iter = 24000
reset_every = 3000
refine_every = 100
pause_refine_after_reset = 100
absgrad = true
revised_opacity = true
verbose = true
key_for_gradient = means2d

[mcmc_strategy]
cap_max = 1000000
noise_lr = 500000.0
refine_start_iter = 500
refine_stop_iter = 3000
refine_every = 100
min_opacity = 0.01
verbose = true
